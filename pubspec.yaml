name: flutter_voice_bridge
description: "AI-powered voice memo app showcasing advanced Flutter integrations. Workshop project demonstrating Platform Channels, FFI, Isolates, and native audio processing beyond Flutter's typical capabilities."

# Repository and homepage information for public release
homepage: https://github.com/esrakadah/flutter_voice_bridge
repository: https://github.com/esrakadah/flutter_voice_bridge
issue_tracker: https://github.com/esrakadah/flutter_voice_bridge/issues

publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  # State management - BLoC pattern with Cubit for clean architecture
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  
  # Dependency injection - Service locator for clean separation of concerns
  get_it: ^8.2.0
  
  # File system access - Documents directory access for recording files
  path_provider: ^2.1.5
  
  # FFI for native library integration (Whisper.cpp)
  ffi: ^2.1.4
  
  # Path manipulation for native library loading
  path: ^1.9.1
  http: ^1.5.0
  permission_handler: ^12.0.1
  
  # Persistent storage for user preferences
  shared_preferences: ^2.5.3
  
  # Gemma AI integration - On-device AI model for chat.
  # Deliberately held at 0.9.x: 1.x changes the model API and needs a device retest.
  flutter_gemma: ^0.9.0
  
  # Image picker for Gemma multimodal chat
  image_picker: ^1.0.4
  
  # Markdown rendering for Gemma responses (flutter_markdown is discontinued)
  flutter_markdown_plus: ^1.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.3      # Modern mocking library (simpler than mockito, no code generation)
  bloc_test: ^10.0.0    # Testing utilities specifically for BLoC/Cubit
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  # The Whisper model is downloaded here by scripts/build_whisper.sh; only .gitkeep is tracked.
  assets:
    - assets/models/
